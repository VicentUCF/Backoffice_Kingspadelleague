@if (store.isLoading()) {
  <p aria-live="polite" role="status">Cargando ranking fantasy...</p>
} @else if (store.errorMessage()) {
  <app-empty-state
    [description]="store.errorMessage() ?? ''"
    [icon]="shieldAlert"
    eyebrow="Ranking"
    layout="feature"
    title="No hemos podido cargar el ranking"
  />
} @else if (store.viewModel(); as viewModel) {
  <header class="fantasy-ranking-page__hero">
    <p class="fantasy-ranking-page__eyebrow">{{ viewModel.phaseLabel }}</p>
    <h1>{{ viewModel.rankingTitle }} · {{ viewModel.leagueName }}</h1>
    <p>{{ viewModel.rankingDescription }}</p>
  </header>
  <app-fantasy-ranking-table [entries]="viewModel.rankingEntries" />
} @else if (store.isNotFound()) {
  <app-empty-state
    [description]="'No existe una liga con ese identificador para consultar su clasificación.'"
    [icon]="shieldAlert"
    eyebrow="Ranking"
    layout="feature"
    title="Liga fantasy no encontrada"
  />
}

<div class="fantasy-ranking-table__wrap">
  <table class="fantasy-ranking-table__table">
    <caption class="u-visually-hidden">
      Clasificación fantasy de la liga
    </caption>
    <thead>
      <tr>
        <th>#</th>
        <th>Equipo</th>
        <th>Manager</th>
        <th>Total</th>
        <th>Jornada</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody>
      @for (entry of entries(); track entry.rankLabel) {
        <tr [class.fantasy-ranking-table__row--mine]="entry.isMe">
          <td>{{ entry.rankLabel }}</td>
          <td>{{ entry.teamName }}</td>
          <td>{{ entry.managerName }}</td>
          <td>{{ entry.totalPointsLabel }}</td>
          <td>{{ entry.matchdayPointsLabel }}</td>
          <td>{{ entry.teamValueLabel }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
